<body>

<?php
$display = "0";

if (isset($_POST['display'])) {
    $display = $_POST['display'];
}

if (isset($_POST['btn'])) {
    $btn = $_POST['btn'];

    if ($btn == "CLEAR") {
        $display = "0";
    } elseif ($btn == "=") {
        if (preg_match('/^(-?\d+\.?\d*|\.\d+)\s*([+\-*\/])\s*(-?\d+\.?\d*|\.\d+)$/', $display, $matches)) {
            $num1 = (float)$matches[1];
            $operator = $matches[2];
            $num2 = (float)$matches[3];

            if ($operator == "+") {
                $display = $num1 + $num2;
            } elseif ($operator == "-") {
                $display = $num1 - $num2;
            } elseif ($operator == "*") {
                $display = $num1 * $num2;
            } elseif ($operator == "/") {
                if ($num2 != 0) {
                    $display = $num1 / $num2;
                } else {
                    $display = "Err";
                }
            }
        } else {
            $display = "Err";
        }
    } else {
        if ($display == "0" || $display == "Err") {
            $display = $btn;
        } else {
            $display .= $btn;
        }
    }
}
?>

<div class="calculator">
    <h2>PHP Calculator</h2>

    <form method="post">
        <input type="hidden" name="display"
               value="<?php echo htmlspecialchars((string)$display); ?>">

        <input type="text" id="display"
               value="<?php echo htmlspecialchars((string)$display); ?>"
               readonly>

        <div class="buttons">
            <button name="btn" value="7">7</button>
            <button name="btn" value="8">8</button>
            <button name="btn" value="9">9</button>
            <button name="btn" value="/" class="operator">÷</button>

            <button name="btn" value="4">4</button>
            <button name="btn" value="5">5</button>
            <button name="btn" value="6">6</button>
            <button name="btn" value="*" class="operator">×</button>

            <button name="btn" value="1">1</button>
            <button name="btn" value="2">2</button>
            <button name="btn" value="3">3</button>
            <button name="btn" value="-" class="operator">−</button>

            <button name="btn" value="0">0</button>
            <button name="btn" value=".">.</button>
            <button name="btn" value="=" class="equal">=</button>
            <button name="btn" value="+" class="operator">+</button>
        </div>

        <button name="btn" value="CLEAR" class="clear">CLEAR</button>
    </form>
</div>

</body>
